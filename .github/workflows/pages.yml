name: Deploy Pages

on:
  pull_request:
    paths:
      - 'web/**'
      - 'data/verified_btc_disclosures_2026.json'
      - 'scripts/verify_btc_disclosures.py'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'data/verified_btc_disclosures_2026.json'
      - 'scripts/verify_btc_disclosures.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate verified disclosure ledger
        run: |
          python scripts/verify_btc_disclosures.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('data/verified_btc_disclosures_2026.json').read_text())
          records=[r for r in d['records'] if r.get('as_of_date')]
          latest=max(records,key=lambda r:(r['as_of_date'],r['reported_date'],r['record_id']))
          assert latest['as_of_date'] >= '2026-08-02'
          assert latest['total_btc'] == d['latest_verified']['total_btc']
          assert latest['aggregate_purchase_price_usd'] == d['latest_verified']['aggregate_purchase_price_usd']
          assert latest['average_purchase_price_usd'] == d['latest_verified']['average_purchase_price_usd']
          assert latest['source_url'].startswith('https://www.sec.gov/Archives/')
          assert all(r['verification_status']=='primary_source_verified' for r in records)
          PY
      - name: Validate dashboard JavaScript and evidence journey
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('web/index.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S)
          assert len(scripts)==1
          Path('/tmp/dashboard.js').write_text(scripts[0])
          assert 'latest verified disclosure' in html.lower()
          assert 'latest verified disclosure ≠ current company state' in html.lower()
          assert 'verified_btc_disclosures_2026.json' in html
          assert 'id="latestSource"' in html
          assert 'Verify latest primary source' in html
          assert 'latestSource.href = latest.source_url' in html
          assert 'up to the latest 12 verified states' in html.lower()
          assert 'Open the canonical ledger for the full verified record.' in html
          assert 'min-height:44px' in html
          assert ':focus-visible' in html
          assert '#F7F5EF' in html and '#17233F' in html and '#2563EB' in html
          PY
          node --check /tmp/dashboard.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build static artifact
        run: |
          mkdir -p _site
          cp web/index.html _site/index.html
          cp data/verified_btc_disclosures_2026.json _site/verified_btc_disclosures_2026.json
          printf '{"sha":"%s"}\n' '${{ github.sha }}' > _site/deployment.json
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Verify production artifact
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          base=os.environ['PAGE_URL'].rstrip('/')+'/'
          expected=os.environ['EXPECTED_SHA']
          last=None
          for _ in range(12):
              try:
                  req=urllib.request.Request(base,headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      html=r.read().decode()
                  with urllib.request.urlopen(base+'deployment.json',timeout=20) as r:
                      meta=json.load(r)
                  with urllib.request.urlopen(base+'verified_btc_disclosures_2026.json',timeout=20) as r:
                      data=json.load(r)
                  latest=data['latest_verified']
                  journey_ok=('id="latestSource"' in html and 'Verify latest primary source' in html and 'latestSource.href = latest.source_url' in html and 'up to the latest 12 verified states' in html.lower() and 'Open the canonical ledger for the full verified record.' in html)
                  if meta.get('sha')==expected and latest['as_of_date']>='2026-08-02' and latest['total_btc']==842138 and journey_ok:
                      print('PRODUCTION_VERIFIED',base,expected,latest['as_of_date'],latest['total_btc'],'headline-evidence-cta','timeline-scope-disclosed')
                      break
                  last=(meta,latest,journey_ok)
              except Exception as exc:
                  last=repr(exc)
              time.sleep(5)
          else:
              raise SystemExit(f'production verification failed: {last!r}')
          PY
