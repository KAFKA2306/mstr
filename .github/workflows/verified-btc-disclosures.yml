name: CI

on:
  pull_request:
    paths:
      - data/verified_btc_disclosures_2026.json
      - src/current_btc_state.py
      - scripts/collect_sec_filings.py
      - scripts/verify_btc_disclosures.py
      - tests/**
      - .github/workflows/verified-btc-disclosures.yml
  push:
    branches: [main]
    paths:
      - data/verified_btc_disclosures_2026.json
      - src/current_btc_state.py
      - scripts/collect_sec_filings.py
      - scripts/verify_btc_disclosures.py
      - tests/**
      - .github/workflows/verified-btc-disclosures.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m compileall -q src scripts tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate disclosure ledger
        run: python scripts/verify_btc_disclosures.py
      - name: Read current BTC state
        run: python src/current_btc_state.py
      - name: Verify clean checkout
        run: git diff --exit-code
