name: Treasury evidence

on:
  pull_request:
    paths:
      - data/treasury/**
      - scripts/update_treasury.py
      - scripts/publish_treasury.py
      - tests/test_treasury_point_in_time.py
      - .github/workflows/treasury-evidence.yml
  push:
    branches: [main]
    paths:
      - data/treasury/major-events.json
      - scripts/update_treasury.py
      - scripts/publish_treasury.py
      - .github/workflows/treasury-evidence.yml
  schedule:
    - cron: '37 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: treasury-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile and unit test
        run: |
          python -m py_compile scripts/update_treasury.py scripts/publish_treasury.py tests/test_treasury_point_in_time.py
          python -m unittest -v tests.test_treasury_point_in_time
      - name: Verify primary-source identities and build point-in-time views
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/publish_treasury.py \
              --evidence-dir build/data/treasury/evidence \
              --api-dir build/api/v1/bitcoin-treasury
          else
            python scripts/publish_treasury.py
          fi
      - name: Audit point-in-time outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/api/v1/bitcoin-treasury') if '${{ github.event_name }}' == 'pull_request' else Path('api/v1/bitcoin-treasury')
          evidence = Path('build/data/treasury/evidence') if '${{ github.event_name }}' == 'pull_request' else Path('data/treasury/evidence')
          index = json.loads((root/'index.json').read_text())
          events = json.loads((root/'events.json').read_text())['events']
          snapshots = json.loads((root/'snapshots.json').read_text())['snapshots']
          latest = json.loads((root/'latest.json').read_text())
          instruments = json.loads((root/'instruments.json').read_text())['instruments']
          manifest = json.loads((evidence/'manifest.json').read_text())
          archive = manifest['issuer_archive']

          assert index['coverage']['event_count'] >= 10
          assert index['coverage']['source_accession_count'] == len(events)
          assert index['coverage']['first_effective_at'] <= '2024-03-18'
          assert index['coverage']['last_effective_at'] >= '2026-07-05'
          assert len(events) == len(snapshots)
          assert all(event['source_url'].startswith('https://www.sec.gov/Archives/') for event in events)
          assert all(event['accession_number'] for event in events)
          assert archive['source_url'] == 'https://www.strategy.com/financial-documents'
          assert archive['retrieval_status'] in {'ok', 'origin_blocked_403'}
          if archive['retrieval_status'] == 'ok':
              assert archive['http_status'] == 200
              assert len(archive['sha256']) == 64
              assert {'SEC Filings and Documents', 'Form 8-K', 'Jul 6, 2026'} <= set(archive['verified_markers'])
          else:
              assert archive['http_status'] == 403
              assert archive['sha256'] is None
              assert archive['evidence'] is None
              assert archive['verified_markers'] == []
          assert '2029 Convertible Notes' in instruments
          assert {'STRK', 'STRF', 'STRD', 'STRC'} <= set(instruments)
          assert latest['state']['bitcoin_holdings']['value'] == 843775
          assert latest['state']['usd_reserve']['value'] == 2550000000
          assert latest['state']['basic_shares_outstanding']['known_at'] == '2024-09-20T00:00:00Z'
          assert latest['state']['bitcoin_holdings']['known_at'] == '2026-07-06T00:00:00Z'
          PY
      - name: Upload pull-request evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: bitcoin-treasury-primary-evidence
          path: build
          retention-days: 30
      - name: Commit changed issuer evidence and views
        if: github.event_name != 'pull_request'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/treasury/evidence api/v1/bitcoin-treasury
          if git diff --cached --quiet; then
            echo 'No treasury evidence change.'
          else
            git commit -m 'data: update Strategy treasury evidence'
            git push
          fi
          git fetch origin main
          test "$(git ls-tree -r --name-only origin/main | grep -c '^api/v1/bitcoin-treasury/index.json$')" -eq 1
          test "$(git ls-tree -r --name-only origin/main | grep -c '^data/treasury/evidence/manifest.json$')" -eq 1
